# Auto-resolve a PR's merge conflicts with its base branch: an OPTIONAL
# deterministic generated-file pre-pass (`pnpm resolve-generated`, only when the
# repo defines that script) plus an LLM pass over the remaining SOURCE conflicts,
# one bounded model call per conflicted file, pushed back as a normal merge
# commit. Generated files whose sources also conflicted are excluded from the LLM
# prompt and regenerated once the sources are resolved; a conflict with no textual
# resolution (a `-merge`-attributed lockfile, a binary) fails the run with a PR
# comment BEFORE any LLM cost. Safety rails: same-repo PRs only (a fork's token is
# read-only and its author is untrusted), non-bot / non-draft authors, conflicts
# in protected paths (this repo's Claude config and CI machinery) are still
# resolved by the LLM but flagged for human review in the pushed-resolution
# comment, and the resolved head is re-validated by CI + human review before it
# can merge. The workflow comments on a PR only when it actually pushes something
# (or fails mid-resolution) — a run that ends up doing nothing says nothing. The
# merge commit is pushed with the workflow-capable TEMPLATE_SYNC_TOKEN (the only
# token GitHub allows to update workflow files, and a PAT so the push retriggers
# the PR's checks); if that secret is absent the PR is labeled
# `auto-resolve-blocked` and skipped until a human provisions the token and
# removes the label — otherwise every base push would re-run a paid resolve into
# the same rejection.
# It mutates the PR branch, so — like the pre-commit autofix — it is NOT a
# required check.
#
# Adopters turn it off with repository VARIABLES rather than by editing this
# file, which template-sync would hand back: AUTO_RESOLVE_DISABLED=true for the
# whole workflow, AUTO_RESOLVE_SCHEDULE_DISABLED=true for the backstop scan
# alone, AUTO_RESOLVE_SELF_REVIEW_DISABLED=true for the pre-push review. README's
# "Auto-resolving merge conflicts" section is the user-facing copy of this list.
#
# ── Trust model ───────────────────────────────────────────────────────────────
#
# TWO JOBS, and the split IS the security boundary. `resolve` checks out the PULL
# REQUEST'S OWN HEAD and runs things out of it — the `setup-base-env` local
# composite (a `uses: ./…` path resolves against the workspace, i.e. against the
# PR's copy), `pnpm resolve-generated` (the PR's own node code), and the model
# itself. `land` holds the push credential and runs none of that.
#
# The separation is load-bearing rather than tidy, because a single job leaks
# through every step-to-step channel the runner provides. Anything executing in
# `resolve` can append to $GITHUB_ENV — BASH_ENV=/tmp/x.sh makes the next `run:`
# step source attacker shell before its first line — or to $GITHUB_PATH, or plant
# a `git`/`gh` in a directory an earlier step published. So the unit of exposure
# is the JOB, not the step: staging the resolver scripts from the base ref stops
# a PR from rewriting the resolver's LOGIC, but it was never a boundary around
# the resolver's CREDENTIALS. No such channel crosses a job boundary.
#
# One artifact crosses — a git bundle of the merge commit, and nothing else.
# `land` treats it as UNTRUSTED: it replays the same merge itself in a tree the
# model never touched and requires the bundled commit to differ from that replay
# only in paths git's own merge left conflicted, with no markers, before it
# pushes. It transmits no manifest for `land` to believe, because every claim it
# could make is one `land` would have to re-derive anyway.
#
# Kept a SEPARATE file from the pull_request_target reviewers on purpose: this
# workflow checks out the PR HEAD (the resolve job) to merge into it, whereas the
# reviewers run under pull_request_target with base-only checkouts. Co-locating a
# head checkout with pull_request_target trips CodeQL's untrusted-checkout query,
# which is file-scoped and cannot see the per-job event gating — and it would
# blind that query to the secrets-bearing reviewer jobs. Splitting keeps the
# reviewers under full CodeQL coverage and this head-checkout resolver on its own
# unprivileged triggers.
#
# A conflict is created either by the PR branch moving (a pull_request event) or
# by the base branch moving underneath the PR (a push to main). The latter emits
# NO pull_request event, and does not re-fire the `labeled` event for a PR that
# already carries the merge-conflict label, so a push scan — re-checking every
# open PR the same way the merge-conflict labeler does — is the only trigger that
# reaches a conflict introduced from underneath the branch. The `discover` job
# turns whichever event fired into the set of eligible PRs; `resolve` fans out
# over them and `land` pushes what it produced.
#
# claude-code-action rejects `push` (and `schedule`) events outright
# ("Unsupported event type"), so such a run never resolves directly: when its
# scan finds conflicting PRs, the `relay` job re-fires this workflow as a
# workflow_dispatch (which the action does support) and THAT run re-discovers and
# resolves. GITHUB_TOKEN's recursion guard exempts workflow_dispatch, so the relay
# dispatch does start a run; the dispatched run can't relay again (relay fires
# only on push/schedule), so no loop.
#
# The scheduled scan closes the born-conflicted gap: a PR whose branch was cut
# from an older main conflicts the instant it opens, but the `opened` event may
# never drive a resolve — most sharply when the PR is opened via the API/app
# token, since GitHub suppresses workflow triggers for events a GITHUB_TOKEN /
# app actor generates (its own recursion guard). Such a PR then waits for the
# next push-to-main scan, which is arbitrarily far off. The schedule re-scans
# every open PR on a fixed cadence and relays exactly like the push scan, so a
# conflicting PR is picked up within the interval no matter which events reached
# (or skipped) it.
name: Auto-resolve merge conflicts

on:
  pull_request: # not-required-check — mutates the PR branch; never gate merges on it
    types: [opened, synchronize, reopened, labeled]
  # push-ungated: a push to main is what flips open PRs to CONFLICTING; re-scan
  # them all (the labeler fires on the same event for the same reason).
  push:
    branches: [main]
  # Backstop for born-conflicted PRs no push/label/opened event resolved in time
  # (see the header note). Runs discover across every open PR and relays like the
  # push scan. Every 5 minutes (GitHub's minimum cron granularity) — discover is a
  # cheap, deterministic scan (a few gh API calls, ~30s) that only fans out to the
  # paid resolve when it actually finds a conflicting PR, so a tight cadence just
  # shortens the born-conflicted wait without incurring LLM cost on empty scans.
  #
  # CADENCE IS ADOPTER-TUNABLE: this cron is the knob — a low-PR-volume repo can
  # slow it (e.g. "*/30 * * * *" or hourly). A repo that wants no scheduled
  # backstop at all sets the repository variable AUTO_RESOLVE_SCHEDULE_DISABLED=true
  # (the discover job's `if:` gates the schedule path on it) without editing YAML.
  schedule:
    - cron: "*/5 * * * *"
  # The push/schedule scan's resolve vehicle (see the relay note above); discover
  # re-scans every open PR, so the relay dispatch carries no inputs. `catch-up`
  # is for a HUMAN dispatch over a backlog: it drops both spend filters (the
  # commit-age window and the per-head attempt mark) for that one run, so PRs a
  # resolver defect stranded are picked up without waiting out the mark's TTL.
  workflow_dispatch:
    inputs:
      catch-up:
        description: "Ignore the commit-age window and per-head attempt marks for this run"
        type: boolean
        default: false

permissions: {}

jobs:
  discover:
    name: Discover PRs to auto-resolve
    # The master switch and the scheduled backstop are both opt-out via a
    # repository variable (cadence knob lives on the cron above), so an adopting
    # repo turns the resolver off without editing this file and having the next
    # template sync hand the edit back. On a `labeled` event, only the
    # merge-conflict label is relevant; every other event enters and the
    # discover script decides eligibility per PR.
    if: >-
      vars.AUTO_RESOLVE_DISABLED != 'true' &&
      (github.event_name != 'schedule' || vars.AUTO_RESOLVE_SCHEDULE_DISABLED != 'true') &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'merge-conflict')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read # the per-head attempt mark is a commit status
    outputs:
      prs: ${{ steps.discover.outputs.prs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
          # A pull_request event checks out the merge ref by default, which would
          # run the PR-authored copy of this CI script — whose `prs` output drives
          # the write-token resolve job. Pin to the trusted base so discover always
          # runs the base version (matches the labeler's base-only checkout); on
          # push this resolves to the pushed main SHA.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Discover conflicting PRs
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Present on a pull_request event → the script considers that one PR;
          # empty on push → it scans every open PR.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # A human catch-up dispatch drops both spend filters for this one run;
          # empty values keep the script's own defaults on every other trigger.
          AUTO_RESOLVE_MAX_COMMIT_AGE_HOURS: ${{ inputs.catch-up && '0' || vars.AUTO_RESOLVE_MAX_COMMIT_AGE_HOURS }}
          AUTO_RESOLVE_IGNORE_ATTEMPT_MARK: ${{ inputs.catch-up && 'true' || 'false' }}
          # Unset repository variables arrive empty, and every script defaults an
          # empty value — so an adopter tunes these without editing this file.
          AUTO_RESOLVE_ATTEMPT_TTL_HOURS: ${{ vars.AUTO_RESOLVE_ATTEMPT_TTL_HOURS }}
        # The base ref won't carry this script until this PR merges, so during
        # that bootstrap window emit an empty set (resolve is skipped) rather than
        # failing on the missing file — a missing discover can only under-act.
        run: |
          script=.github/scripts/auto-resolve-discover.sh
          if [[ -f "$script" ]]; then
            bash "$script"
          else
            echo "discover script absent on base ref (bootstrap window) — nothing to resolve."
            echo "prs=[]" >>"$GITHUB_OUTPUT"
          fi

  relay:
    name: Relay push/schedule scan as workflow_dispatch
    needs: discover
    # Both the push and the scheduled scan run under an event claude-code-action
    # rejects, so both resolve indirectly by re-dispatching. Keep this off
    # workflow_dispatch itself so the relayed run can't relay again (no loop).
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      needs.discover.outputs.prs != '' && needs.discover.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-dispatch this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run auto-resolve-conflicts.yaml --ref "${GITHUB_REF_NAME}"

  resolve:
    name: Auto-resolve merge conflicts
    needs: discover
    # push and schedule run relay instead of resolving (claude-code-action rejects
    # both); resolve happens on the relayed workflow_dispatch (and directly on a
    # pull_request event).
    if: >-
      github.event_name != 'push' && github.event_name != 'schedule' &&
      needs.discover.outputs.prs != '' && needs.discover.outputs.prs != '[]'
    runs-on: ubuntu-latest
    # Covers the per-file fan-out's worst case (SHARD_TIMEOUT_SECONDS x the
    # batches a wide conflict needs at MAX_PARALLEL) plus the pre-bundle
    # self-review and its fix round. A run killed here bundles nothing, so the
    # budget has to cover the loop rather than truncate it.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # Serialize the fan-out: each PR gets its own push, and the shared LLM/token
      # budget makes parallel resolves more contention than speed is worth.
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    # Per-PR so a newer trigger supersedes an in-flight resolve of the SAME PR
    # without cancelling resolves of the others (a push scan carries no PR number
    # at the workflow level, so this must key on the matrix entry).
    concurrency:
      group: auto-resolve-conflicts-${{ matrix.pr.number }}
      cancel-in-progress: true
    permissions:
      # NO write to contents, and that is the point — see the trust model above.
      # This job runs the PR's own composites, the PR's own dependencies and the
      # model, so these scopes are the ceiling on what any of them reach.
      # `pull-requests: write` is the stated residual: the pre-LLM handoff and
      # the failure diagnoses have to land on the PR they are about, and it
      # confers no ability to write a branch.
      contents: read
      pull-requests: write # comment on the PR (handoff / failure diagnosis)
      issues: write # `gh label create` for auto-resolve-blocked rides the issues API
      statuses: write # the per-head attempt mark (and its release) is a commit status
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ matrix.pr.number }}
      PR_NUMBER: ${{ matrix.pr.number }}
      HEAD_REF: ${{ matrix.pr.head_ref }}
      BASE_REF: ${{ matrix.pr.base_ref }}
      # Stands in for claude-code-action's `allowed_bots: github-actions`: the
      # relay dispatches with github.token, so a relayed run's initiating actor
      # is the github-actions bot. The fan-out's gate admits exactly that actor
      # plus actors the API affirmatively reports as having write access, and
      # denies everything else — including the silent-failure cases (no token,
      # a 5xx, a 404 non-collaborator).
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      # How many per-file resolutions may run at once, and the wall-clock bound
      # on each. Both are deliberate: the shards share one LLM credential and
      # the runner's CPU, and without a per-shard timeout a wide conflict can
      # run past the job budget mid-resolution, paying for inference that never
      # commits.
      MAX_PARALLEL: "4"
      SHARD_TIMEOUT_SECONDS: "420"
      # Repository-variable knobs, empty when unset (every script defaults an
      # empty value): the attempt TTL this job's mark is written under, and the
      # paths a resolution here wants a human's eye on.
      AUTO_RESOLVE_ATTEMPT_TTL_HOURS: ${{ vars.AUTO_RESOLVE_ATTEMPT_TTL_HOURS }}
      AUTO_RESOLVE_PROTECTED_RE: ${{ vars.AUTO_RESOLVE_PROTECTED_RE }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # matrix.pr.head_ref is a same-repo branch name (discover drops forks),
          # so this is a trusted ref; scripts authenticate git out-of-band, so no
          # push credential is persisted while PR code runs.
          ref: ${{ matrix.pr.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node + install deps
        uses: ./.github/actions/setup-base-env

      - name: Stage the resolver scripts from the trusted base ref
        # The checkout above is the PR HEAD. Running its copy of the resolver
        # scripts would (a) fail with 127 on any PR whose branch predates them
        # and (b) let a PR rewrite the resolver's OWN logic. Read them from the
        # base ref — the same trusted ref this workflow file itself comes from
        # — into a path outside the working tree, and run THOSE. Authenticated
        # out-of-band (checkout is persist-credentials false), matching the
        # other steps.
        #
        # Check out the WHOLE ref as a second worktree rather than copying a
        # named subset: the resolver entrypoints source siblings and the
        # self-review reads its prompts from this ref, and any enumerated subset
        # leaves whatever it did not anticipate absent — discovered only when a
        # script reaches it, AFTER the paid resolution. A full checkout has
        # nothing to enumerate, so nothing can be missing.
        id: resolver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # allow-long-run: this block IS the trust boundary — it stages the base-ref resolver scripts while the workspace is the PR head, so externalizing it to a script would run the PR head's copy of the stager
          basic="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base="${RUNNER_TEMP}/base"
          git worktree add --detach --quiet "${base}" "origin/${BASE_REF}"
          echo "base=${base}" >>"$GITHUB_OUTPUT"
          echo "dir=${base}/.github/scripts" >>"$GITHUB_OUTPUT"

      - name: Record the attempt on this head
        # Before the merge and before any model call: the mark must survive the
        # outcomes that never reach a later step (a crash, a timeout, a
        # cancellation) — those are exactly the expensive failures it exists to
        # stop repeating. discover skips a freshly-marked head, so a base push
        # cannot re-run a paid resolution against a tree that just produced one.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
        run: |
          script="${RESOLVER_DIR}/auto-resolve-mark-attempt.sh"
          if [[ -f "$script" ]]; then
            bash "$script"
          else
            echo "mark-attempt script absent on base ref (bootstrap window) — skipping."
          fi

      - name: Merge base, deterministic pre-pass, and protected-path flag
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
        run: bash "${RESOLVER_DIR}/auto-resolve-prepare.sh"

      - name: Release the attempt on a no-op run
        # A clean merge means this tree was never resolved at all, so the mark
        # records an attempt that did not happen — left standing it suppresses
        # every later scan of this PR for a full TTL while the base keeps moving.
        # The unresolvable handoff below is a VERDICT, not a no-op, so it keeps
        # its mark.
        if: steps.prepare.outputs.no_op_head != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.prepare.outputs.no_op_head }}
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
        run: |
          script="${RESOLVER_DIR}/auto-resolve-release-attempt.sh"
          if [[ -f "$script" ]]; then
            bash "$script"
          else
            echo "release-attempt script absent on base ref (bootstrap window) — skipping."
          fi

      - name: Hand off unmergeable (lockfile/binary) conflicts to a human
        # Fails the run loud BEFORE any LLM cost: a `-merge`-attributed or
        # binary conflict has no textual resolution an LLM could produce.
        if: steps.prepare.outputs.unresolvable != ''
        env:
          UNRESOLVABLE: ${{ steps.prepare.outputs.unresolvable }}
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
        run: bash "${RESOLVER_DIR}/auto-resolve-handoff.sh"

      # A base-staged SCRIPT, never a local `uses: ./…` composite: the runner
      # reads a local action's manifest out of the WORKSPACE at step time, and
      # from the prepare step onward this job's workspace is the PR head left
      # MID-MERGE — so a PR that conflicts on the composite's own action.yaml
      # would hand the runner a manifest full of conflict markers and kill the
      # resolver before it starts. The script also owns the credential ladder,
      # which the composite could not: a rung advances only when the previous
      # one produced no resolution at all.
      - name: Resolve the remaining source conflicts with Claude
        id: resolve_llm
        if: steps.prepare.outputs.needs_llm == 'true'
        # continue-on-error so a hard failure (a missing/expired key, or the CLI
        # crashing before it writes its log) falls through to the assert step
        # below, which reads the execution log and fails loud with an actionable
        # message rather than a bare error.
        continue-on-error: true
        env:
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
          BASE_WORKTREE: ${{ steps.resolver.outputs.base }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
          CONFLICT_LIST: ${{ steps.prepare.outputs.conflict_list }}
          MODIFY_DELETE_PATHS: ${{ steps.prepare.outputs.modify_delete }}
        run: bash "${RESOLVER_DIR}/claude-conflict-resolve.sh"

      - name: Fail loud if the Claude resolution errored
        id: assert_llm
        # A zero-edit auth/model failure otherwise slips through as green,
        # leaving the markers for the bundle step to misreport as an
        # unresolvable conflict handed to a human. Read the execution log and
        # stop here instead, so a broken credential surfaces as itself. A
        # genuine "conflict too hard" run has is_error false and passes this
        # gate, so the human handoff still happens.
        if: steps.prepare.outputs.needs_llm == 'true'
        env:
          EXECUTION_FILE: ${{ steps.resolve_llm.outputs.execution_file }}
          CONTEXT: Claude conflict resolution
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
        run: bash "${RESOLVER_DIR}/check-claude-execution.sh"

      - name: Verify, self-review, and bundle the merge for the land job
        id: bundle
        if: steps.prepare.outputs.needs_commit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
          BUNDLE_DIR: ${{ runner.temp }}/auto-resolve-bundle
          # The pre-bundle self-review reads the merge commit the way the
          # post-merge watchdog will and lets a model correct what it flags, so
          # a flagged resolution is never handed to `land`. Its prompts and CLI
          # come from the TRUSTED base worktree, never the PR head it reviews.
          BASE_WORKTREE: ${{ steps.resolver.outputs.base }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
          AUTO_RESOLVE_SELF_REVIEW_DISABLED: ${{ vars.AUTO_RESOLVE_SELF_REVIEW_DISABLED }}
          CONFLICT_LIST: ${{ steps.prepare.outputs.conflict_list }}
          DEFERRED_REGEN: ${{ steps.prepare.outputs.deferred_regen }}
          # The marker-free conflicts: one side deleted the path, the other
          # changed it. Bundle stages each from the resolver's recorded verdict
          # rather than from the working tree, which holds the surviving side
          # either way.
          MODIFY_DELETE_PATHS: ${{ steps.prepare.outputs.modify_delete }}
          MODIFY_DELETE_VERDICTS: ${{ steps.resolve_llm.outputs.verdict_file }}
          # Empty when the LLM step was skipped (deterministic-only resolution);
          # bundle defaults it to 0. Non-zero + leftover markers ⇒ the resolver
          # may have been blocked, so the handoff comment names the real cause.
          LLM_PERMISSION_DENIALS: ${{ steps.assert_llm.outputs.permission_denials }}
          # WHICH tools were denied, and on which shard. The count alone never
          # established that edits were blocked: under acceptEdits a denial is
          # normally a tool outside the granted set, which leaves editing fully
          # available — and with one shard per file, only the per-file
          # attribution says whether the denied shard is the one that left
          # markers.
          LLM_PERMISSION_DENIED_TOOLS: ${{ steps.assert_llm.outputs.permission_denied_tools }}
          LLM_PERMISSION_DENIALS_BY_FILE: ${{ steps.assert_llm.outputs.permission_denials_by_file }}
        run: bash "${RESOLVER_DIR}/auto-resolve-bundle.sh"

      # Only on success: a resolve that failed has already commented its own
      # diagnosis and is red, and `land` treats an absent bundle as "nothing to
      # push" rather than as a second failure to report.
      - name: Upload the resolved merge for the land job
        if: steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auto-resolve-merge-${{ matrix.pr.number }}
          path: ${{ runner.temp }}/auto-resolve-bundle
          retention-days: 1

  # Job 2 of 2: land the resolution. Holds the push credential; runs no model,
  # no PR-authored install, no PR-authored script, no local composite.
  land:
    name: Land the auto-resolved merge
    needs: [discover, resolve]
    # always(), gated on `resolve` having run at all: a matrix is one job to
    # `needs`, so a single PR whose resolve failed would otherwise skip the push
    # for every OTHER PR that resolved cleanly. Which entries actually have
    # something to push is decided per-PR by whether the artifact exists.
    if: >-
      always() && needs.resolve.result != 'skipped' &&
      needs.discover.outputs.prs != '' && needs.discover.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    # NOT cancel-in-progress, unlike `resolve`: this job's whole body is a
    # verify-then-push, and cancelling it mid-push wastes a completed paid
    # resolution. A superseding run's push is reconciled by the non-force push
    # and the stand-down check, not by cancellation.
    concurrency:
      group: auto-resolve-conflicts-land-${{ matrix.pr.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push the merge commit to the PR head
      pull-requests: write # comment on / label the PR
      issues: write # `gh label create` for auto-resolve-blocked rides the issues API
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ matrix.pr.number }}
      HEAD_REF: ${{ matrix.pr.head_ref }}
      BASE_REF: ${{ matrix.pr.base_ref }}
      # This job re-derives the protected set from the conflicts it computed
      # itself, so it needs the same definition the rest of the workflow uses.
      AUTO_RESOLVE_PROTECTED_RE: ${{ vars.AUTO_RESOLVE_PROTECTED_RE }}
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The PR's own content, but nothing in this job executes it: it is
          # here so git has the objects the bundle is thin against and a
          # worktree to push from. Everything this job RUNS comes from the
          # base-ref staging below.
          ref: ${{ matrix.pr.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Stage the resolver scripts from the trusted base ref
        # Written out inline rather than shared with `resolve` through a local
        # composite: a `uses: ./…` is resolved against the workspace, i.e.
        # against the pull request's own copy, which is exactly what staging
        # exists to avoid — and this is the job holding the push token.
        id: resolver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # allow-long-run: this block bootstraps the staging that makes every LATER script in this job trusted, so it cannot itself live in a script — at this point the only copy of .github/scripts/ on disk is the pull request's own, which is precisely what it exists to stop being executed
          basic="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base="${RUNNER_TEMP}/base"
          git worktree add --detach --quiet "${base}" "origin/${BASE_REF}"
          echo "dir=${base}/.github/scripts" >>"$GITHUB_OUTPUT"

      - name: Download the resolved merge
        id: bundle
        # continue-on-error: no artifact means this PR's resolve produced
        # nothing to push (it failed and said so, or it found nothing to
        # resolve). The land script reports that and exits 0 rather than
        # manufacturing a second red.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: auto-resolve-merge-${{ matrix.pr.number }}
          path: ${{ runner.temp }}/auto-resolve-bundle

      - name: Re-verify the resolution and push it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Workflow-capable PAT: the merge commit may carry base-branch edits
          # to .github/workflows/, which no other available token can push, and
          # being a PAT the push retriggers the PR's checks. Absent ⇒ land
          # labels the PR auto-resolve-blocked and stops.
          TEMPLATE_SYNC_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          RESOLVER_DIR: ${{ steps.resolver.outputs.dir }}
          BUNDLE_DIR: ${{ runner.temp }}/auto-resolve-bundle
        run: bash "${RESOLVER_DIR}/auto-resolve-land.sh"
