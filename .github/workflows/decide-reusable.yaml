name: Decide (reusable)

# Reusable decide job: determines whether a gate/track job should run based on
# changed paths and/or opt-in keywords in commit messages or the PR title.
# Lets a path-filtered workflow keep firing on every pull_request (so its
# required checks always report) while the expensive jobs skip when nothing
# relevant changed — a skipped job reports success, unlike a workflow-level
# paths filter, which never reports and hangs the required check forever.

on:
  workflow_call:
    inputs:
      paths-regex:
        type: string
        default: ""
        description: "ERE regex; if any changed file matches, run=true is set"
      paths-regex-file:
        # unused-input-ok: this repo's own callers (hook-lifecycle.yaml, zizmor.yaml) don't need it yet; kept for a future local caller or a downstream repo referencing this reusable workflow cross-repo.
        type: string
        default: ""
        description: "Repo path of a shell snippet defining GATE_PATHS_REGEX — the SSOT for a trigger regex a local git hook also sources, so the two consumers cannot drift. Mutually exclusive with paths-regex; a missing file/variable fails the decide job red (never a silent skip)"
      pytest-targets:
        # unused-input-ok: this repo's own callers (hook-lifecycle.yaml, zizmor.yaml) don't need it yet; kept for a future local caller or a downstream repo referencing this reusable workflow cross-repo.
        type: string
        default: ""
        description: "Space-separated pytest files this gate's job runs. The decide job derives their collection-time import closure (.github/scripts/pytest-import-closure.py) and treats every member as a watched path, so a caller states its test dependencies once — in the test's own import lines — instead of retyping them into paths-regex, where the copy drifts silently. Combines with paths-regex (either one matching sets run=true); a target that does not exist fails the decide job red"
      shell-targets:
        type: string
        default: ""
        description: "Space-separated shell entry points this gate's job runs. The decide job derives every in-repo file they can reach (.github/scripts/shell-run-closure.py) and treats each as a watched path, so a caller states its script dependencies once — in the scripts' own text — instead of retyping them into paths-regex, where the copy drifts silently. The derivation over-approximates and cannot see a path built from variables, so it combines with paths-regex rather than replacing it; a target that is not tracked fails the decide job red"
      trigger-keyword:
        # unused-input-ok: this repo's own callers (hook-lifecycle.yaml, zizmor.yaml) don't need it yet; kept for a future local caller or a downstream repo referencing this reusable workflow cross-repo.
        type: string
        default: ""
        description: "Keyword in a commit title (subject line) that forces run=true"
      keyword-scope:
        # unused-input-ok: this repo's own callers (hook-lifecycle.yaml, zizmor.yaml) don't need it yet; kept for a future local caller or a downstream repo referencing this reusable workflow cross-repo.
        type: string
        default: "range"
        description: "Where to scan for the trigger keyword: 'range' (every commit in the PR, the default) or 'head' (only the head commit, so the keyword fires once for the commit it tags and not on later untagged pushes)"
      skip-on-draft:
        # unused-input-ok: this repo's own callers (hook-lifecycle.yaml, zizmor.yaml) don't need it yet; kept for a future local caller or a downstream repo referencing this reusable workflow cross-repo.
        type: boolean
        default: false
        description: >
          When true, the gate skips (run=false) while the PR is a draft, deferring the
          workflow's expensive jobs until the PR is marked ready for review. The always()
          reporter greens the skip so a required check stays satisfied. A caller that opts
          in MUST also list ready_for_review in its pull_request `types:` (else marking the
          PR ready won't re-fire the workflow). No effect off the pull_request path —
          push/merge_group/dispatch carry no draft flag.
      base-sha:
        # unused-input-ok: this repo's own callers (hook-lifecycle.yaml, zizmor.yaml) don't need it yet; kept for a future local caller or a downstream repo referencing this reusable workflow cross-repo.
        type: string
        default: ""
        description: "Explicit diff base for a run whose event payload carries no range (a workflow_dispatch forwarding a pushed before…sha). Takes precedence over the event-derived base; empty derives from the event, and an event with no range fails OPEN (run everything)"
      head-sha:
        # unused-input-ok: this repo's own callers (hook-lifecycle.yaml, zizmor.yaml) don't need it yet; kept for a future local caller or a downstream repo referencing this reusable workflow cross-repo.
        type: string
        default: ""
        description: "Explicit diff head paired with base-sha"
      memoize-anchor-jobs:
        type: string
        default: ""
        description: >
          ERE over JOB NAMES. When set, the decide step also computes what it would
          decide if it diffed from the last commit on this branch where a matching
          job CONCLUDED SUCCESS, instead of from the pull request's base — and logs
          both verdicts without acting on the memo one. Name the EXPENSIVE jobs:
          a reporter or the decide job itself concludes success on a skip, so
          anchoring on one would treat an inherited green as a verified tree and
          stop watching the deltas in between. Empty (the default) computes nothing.
      ignore-comment-only-changes:
        type: boolean
        default: false
        description: >
          When true, a paths-regex match whose diff (restricted to the matched files) is
          pure comment/blank churn does NOT set run=true. Safe for TESTS / BUILD / PERF /
          E2E / EVAL jobs — comment content cannot change their outcome — including required
          ones, because the detector is ONE-WAY: a substantive change never reads as
          comment-only (see diff-comment-only.sh). Do NOT enable for LINT / TYPE-CHECK /
          FORMAT / security-scan jobs — a directive comment (# noqa, # type: ignore,
          # pylint: disable, // eslint-disable, # shellcheck disable, # hadolint ignore,
          # fmt: off) IS behavior for those tools, so skipping such a change would report
          the required check green while masking a real failure.
    outputs:
      run:
        description: "Whether the gate/track job should run"
        value: ${{ jobs.decide.outputs.run }}

# EVERY CALLER'S `decide` JOB MUST GRANT THESE THREE. A called workflow may only
# request permissions the calling job already holds, and a caller that grants
# fewer does not go red — the whole run ends in `startup_failure`, so the
# workflow's reporter never posts and its required check hangs at "Expected —
# Waiting" forever, which is the exact failure this gate exists to prevent.
permissions:
  contents: read
  # Re-read the live draft state (decide_pr_is_draft_now), which the payload's
  # draft flag only snapshots at dispatch.
  pull-requests: read
  # List this workflow's past runs and their jobs (decide-memo-base.py). A public
  # repository serves that read to a token without the scope, so this is what
  # keeps the memo working in a PRIVATE fork of this template, where the same
  # call answers 403 and the shadow then silently never anchors.
  actions: read

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
