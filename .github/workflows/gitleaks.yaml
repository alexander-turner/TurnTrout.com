name: Gitleaks Secret Scanning

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # Three 3-minute checkout attempts fit inside this budget with room for
    # the scan itself.
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      # GitHub's git backend intermittently stalls mid-fetch, and a stalled
      # fetch takes the whole job down before a step has run. A healthy fetch
      # of this repo finishes inside a minute, so each attempt gets a budget
      # that a stall trips quickly rather than one it can sit out; the retry
      # re-checkouts clean, so a partial fetch can't corrupt the workspace.
      - id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: checkout-retry
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - if: steps.checkout-retry.outcome == 'failure'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Download pinned gitleaks
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 \
            -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/gitleaks-scan.sh

  # Stable Required check: runs even when `gitleaks` is cancelled/skipped, so a
  # protected branch never gets stuck on a check that never reports.
  gitleaks-passed: # required-check: true
    if: always()
    needs: [gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github/actions/report-job-result
            .github/scripts
          persist-credentials: false

      - name: Report result
        uses: ./.github/actions/report-job-result
        with:
          run: "true"
          decide-result: "success"
          result: ${{ needs.gitleaks.result }}
