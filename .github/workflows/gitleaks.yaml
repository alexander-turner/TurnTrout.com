name: Gitleaks Secret Scanning

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks: # required-check: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      # GitHub's git backend intermittently stalls mid-fetch, and a full-history
      # fetch is long enough to hit it. The second attempt starts from a clean
      # workspace, so a partial fetch from the first can't corrupt it.
      - id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 5
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Download pinned gitleaks
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 \
            -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/gitleaks-scan.sh
