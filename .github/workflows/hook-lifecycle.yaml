name: Hook lifecycle

# Runs the full Claude hook lifecycle (session setup -> pre-commit -> pre-push)
# on a clean checkout, so a broken hook is caught in CI rather than in a session.

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  decide:
    permissions:
      contents: read # the reusable gate checks out the tree
      pull-requests: read # its live draft re-read (decide_pr_is_draft_now)
      actions: read # its memo shadow lists this workflow's past runs (needed in a private fork)
    uses: ./.github/workflows/decide-reusable.yaml
    with:
      # Most of this gate's watched set is DERIVED from the entry point below, so
      # it cannot drift out of date. The regex carries only what the derivation
      # cannot see: a path this job's tooling reads without any script naming it,
      # a script reached through a variable, and the composite action, which is
      # YAML rather than shell.
      # POSIX ERE, read by `grep -E` — no PCRE escapes (\d, \w, (?:…)).
      paths-regex: '^(\.claude/hooks/|\.hooks/|setup\.sh$|pnpm-lock\.yaml$|\.github/actions/setup-base-env/|\.gitattributes$|\.github/tool-versions\.sh$|\.github/scripts/install-mergiraf\.sh$)'
      # path-gate-ok: .github/scripts/run-hook-lifecycle.sh it is the shell-targets entry point below, so the decide job derives it and everything it reaches
      shell-targets: .github/scripts/run-hook-lifecycle.sh
      # The lifecycle run is a behavior test, so a comment-only touch of a watched
      # file cannot change its outcome. Never set this on a lint/format/type gate,
      # where a directive comment IS behavior.
      ignore-comment-only-changes: true
      # Anchor the memo shadow on the work job, never on the reporter: the reporter
      # concludes success on a skip, so it would read an inherited green as a
      # verified tree.
      memoize-anchor-jobs: "^hook-lifecycle$"

  hook-lifecycle:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env
        with:
          setup-python: "true"

      # path-gate-ok: .github/scripts/run-hook-lifecycle.sh the decide job watches it through shell-targets, which derives it and everything it reaches; the checker reads paths-regex only
      # path-gate-ok: .github/scripts/merge-driver-probe.sh run-hook-lifecycle.sh calls it, so shell-targets derives it too
      - name: Run hook lifecycle
        run: bash .github/scripts/run-hook-lifecycle.sh

  hook-lifecycle-passed: # required-check: true
    if: always()
    needs: [decide, hook-lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github/actions/report-job-result
          persist-credentials: false

      - name: Report result
        uses: ./.github/actions/report-job-result
        with:
          run: ${{ needs.decide.outputs.run }}
          decide-result: ${{ needs.decide.result }}
          result: ${{ needs.hook-lifecycle.result }}
