name: Phone Home Improvements

# When a PR is merged that contains a "Lessons Learned" section,
# this workflow opens an issue on the template repository so the
# improvement can be adopted across all downstream projects.

on:
  pull_request:
    types: [closed]

env:
  TEMPLATE_REPO: "${{ vars.TEMPLATE_SYNC_ORG || 'AlexanderMattTurner' }}/claude-automation-template"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  phone-home:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Extract lessons from PR body
        id: extract
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.github/scripts/phone-home-extract.js')
            await run({github, context, core})

      - name: Restore cached gitleaks binary
        id: gitleaks-cache
        if: steps.extract.outputs.has_lessons == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ env.GITLEAKS_VERSION }}

      - name: Download gitleaks
        if: steps.extract.outputs.has_lessons == 'true' && steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --proto '=https' -fsSL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xz -C /usr/local/bin -f /tmp/gitleaks.tar.gz gitleaks

      - name: Scan lessons for leaked secrets
        if: steps.extract.outputs.has_lessons == 'true'
        run: |
          set -euo pipefail
          chmod +x /usr/local/bin/gitleaks
          gitleaks detect --no-git -s /tmp/phone-home -v

      # Filing the issue needs TEMPLATE_SYNC_TOKEN, except in the template itself,
      # where GITHUB_TOKEN reaches its own repo. phone-home-submit.js throws on a
      # failed call, so without this step every merged PR with lessons turns red
      # in a consumer that never set the secret. `secrets.*` is not readable in
      # `if:`, so the presence arrives here as an env value.
      - name: Check that this repo can file the lessons issue
        id: route
        if: steps.extract.outputs.has_lessons == 'true'
        env:
          HAS_SYNC_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN != '' }}
          IS_TEMPLATE: ${{ github.repository == env.TEMPLATE_REPO }}
        run: |
          if [[ "$HAS_SYNC_TOKEN" == true || "$IS_TEMPLATE" == true ]]; then
            echo "submit=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning title=Lessons not filed::Set the TEMPLATE_SYNC_TOKEN secret to file this PR's lessons on ${TEMPLATE_REPO}."
          echo "submit=false" >>"$GITHUB_OUTPUT"

      - name: Submit to template repo
        if: steps.route.outputs.submit == 'true'
        env:
          # Opening an issue on TEMPLATE_REPO needs write access to a DIFFERENT
          # repo than the one running this job, which GITHUB_TOKEN cannot reach
          # unless TEMPLATE_REPO is public — so this only degrades gracefully
          # when the target is the public template repo itself (running-repo ==
          # target-repo); every other downstream repo needs TEMPLATE_SYNC_TOKEN.
          # token-fallback-ok: designed graceful degradation, not an accident.
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ steps.extract.outputs.pr_title }}
          PR_URL: ${{ steps.extract.outputs.pr_url }}
          SOURCE_REPO: ${{ steps.extract.outputs.source_repo }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ env.GH_TOKEN }}
          script: |
            const run = require('./.github/scripts/phone-home-submit.js')
            await run({github, context, core})
