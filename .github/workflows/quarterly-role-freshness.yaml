name: Quarterly Role Freshness

# Quarterly, Claude checks every present-tense description of someone's current
# job in website_content/ (e.g. the mentee list on team-shard.md) against the
# web, corrects the stale ones, and the workflow opens a PR with a
# was/now/source table. Instructions live in
# .github/prompts/role-freshness-prompt.md.
#
# Claude gets no Bash and no push access: it reads the web, edits Markdown, and
# writes a report. The PR is opened by create-pull-request afterwards, with
# add-paths limited to website_content/, so a prompt injection from a fetched
# page cannot touch workflows or code.

concurrency:
  group: quarterly-role-freshness
  cancel-in-progress: false

on:
  schedule:
    # 2nd of January, April, July, and October at 09:23 UTC.
    - cron: "23 9 2 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Audit current-role descriptions with Claude
        uses: anthropics/claude-code-action@c038e4dcdedfbbca18dfb17df35a17e40ded4ddc # v1.0.186
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-6
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow the instructions in .github/prompts/role-freshness-prompt.md — it is the single source of truth for this job.
          claude_args: "--allowedTools Read Write Edit MultiEdit Glob Grep WebSearch WebFetch"

      - name: Collect report
        id: report
        run: |
          if [ ! -s role-freshness/REPORT.md ]; then
            echo "::error::Claude did not write role-freshness/REPORT.md"
            exit 1
          fi
          {
            echo "# Quarterly role-freshness audit"
            echo
            echo "_Auto-generated by \`.github/workflows/quarterly-role-freshness.yaml\`. Verify each source before merging._"
            echo
            cat role-freshness/REPORT.md
          } > "$RUNNER_TEMP/role-freshness-report.md"
          rm -r role-freshness
          cat "$RUNNER_TEMP/role-freshness-report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "body_path=$RUNNER_TEMP/role-freshness-report.md" >> "$GITHUB_OUTPUT"

      - name: Open pull request with updates
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # A PAT so the PR triggers CI; GITHUB_TOKEN-authored PRs do not.
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          branch: automated/role-freshness
          delete-branch: true
          commit-message: "content: refresh stale current-role descriptions"
          title: "content: quarterly role-freshness updates"
          body-path: ${{ steps.report.outputs.body_path }}
          add-paths: website_content/*.md
