name: Quarterly Role Freshness

# Quarterly, Claude checks every present-tense description of someone's current
# job in website_content/ (e.g. the mentee list on team-shard.md) against the
# web, corrects the stale ones, and the workflow opens a PR with a
# was/now/source table. Instructions live in
# .github/prompts/role-freshness-prompt.md.
#
# Claude reads untrusted web pages, so it runs in `audit` with a read-only
# token and no PAT; anything it writes to that workspace (including .git/)
# stays there. `propose` holds the PAT, runs none of Claude's output, and only
# applies the website_content/*.md hunks of the exported patch to a fresh
# checkout.

concurrency:
  group: quarterly-role-freshness
  cancel-in-progress: false

on:
  schedule:
    # 2nd of January, April, July, and October at 09:23 UTC.
    - cron: "23 9 2 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Audit current-role descriptions with Claude
        uses: anthropics/claude-code-action@c038e4dcdedfbbca18dfb17df35a17e40ded4ddc # v1.0.186
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow the instructions in .github/prompts/role-freshness-prompt.md — it is the single source of truth for this job.
          claude_args: "--allowedTools Read Write Edit MultiEdit Glob Grep WebSearch WebFetch"

      - name: Export patch and report
        run: |
          if [ ! -s role-freshness/REPORT.md ]; then
            echo "::error::Claude did not write role-freshness/REPORT.md"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          cp role-freshness/REPORT.md "$RUNNER_TEMP/out/REPORT.md"
          git -c core.fsmonitor=false diff --no-ext-diff --no-textconv \
            -- 'website_content/*.md' > "$RUNNER_TEMP/out/changes.patch"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: role-freshness
          path: ${{ runner.temp }}/out/
          retention-days: 7

  propose:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GITHUB_TOKEN stays read-only: the branch push and PR use the PAT.

    steps:
      # PRs created with the default GITHUB_TOKEN never start workflows, which
      # would leave the PR's required checks pending forever.
      - name: Require TEMPLATE_SYNC_TOKEN
        env:
          HAS_PAT: ${{ secrets.TEMPLATE_SYNC_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::TEMPLATE_SYNC_TOKEN is not set; a PR created with GITHUB_TOKEN would never trigger its required checks."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        timeout-minutes: 5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: role-freshness
          path: ${{ runner.temp }}/in

      - name: Apply content edits and build PR body
        run: |
          PATCH="$RUNNER_TEMP/in/changes.patch"
          if [ -s "$PATCH" ]; then
            git apply --include='website_content/*.md' "$PATCH"
          fi
          {
            echo "# Quarterly role-freshness audit"
            echo
            echo "_Auto-generated by \`.github/workflows/quarterly-role-freshness.yaml\`. Verify each source before merging._"
            echo
            cat "$RUNNER_TEMP/in/REPORT.md"
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request with updates
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          branch: automated/role-freshness
          delete-branch: true
          commit-message: "content: refresh stale current-role descriptions"
          title: "content: quarterly role-freshness updates"
          body-path: ${{ runner.temp }}/body.md
          add-paths: website_content/*.md
