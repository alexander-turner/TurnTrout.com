name: Sync from Template

# Syncs updates from the template repository automatically.
# Runs daily or manually via "Run workflow" button.
# No setup required - works out of the box.
#
# allow-workflow-ref: template-sync-reusable.yaml lives in the template repository.
# This file only calls the template's template-sync-reusable.yaml, which holds
# the sync job. Every script that job runs comes from the template, so a stale
# local copy of the sync scripts cannot break the sync that would replace it.
#
# Features:
# - Skips entirely in the template repository itself, and fails loud when
#   TEMPLATE_SYNC_ORG points the sync at a fork of the running repo
# - 3-way merges local customizations with template updates automatically
# - Falls back to template version + Claude resolution when no merge base exists
# - Detects new files, changed files, and deleted files from the template
# - Tracks which template version the repo is synced to (.template-version)
# - Requests @claude to resolve any remaining conflicts and finalize the merge
#
# =============================================================================
# HANDLING CUSTOMIZATIONS DURING SYNC
# =============================================================================
# Projects may have local customizations in synced files (e.g., project-specific
# tools in session-setup.sh, custom pre-commit checks). When resolving conflicts:
#
# 1. Look for header comments like "IMPORTANT: This file has project-specific
#    customizations" or "Future Claudes: Leave these customizations as-is"
# 2. Preserve local customizations while adopting new template features
# 3. When in doubt, keep local changes - they exist for a reason
# 4. Check for duplicate CI: if the target repo already has test/lint/format
#    workflows, delete the template's versions. A file the sync delivered
#    before and the adopter deleted is reported as declined, not restored, so
#    the deletion holds on its own and needs no exclude-paths entry.
# 5. A workflow that must never be introduced into a repo that has its own
#    equivalent (the release flow) belongs in opt-in-paths.
# 6. A file the template MOVED arrives at its new path while the old one stays
#    local, because this sync reports deletions and never applies them. Delete
#    the local copy and repoint whatever names it. The case that fails silently:
#    each composite action now carries its own scripts and tests under
#    .github/actions/<name>/, so a repo whose package.json still runs
#    `node --test ".github/scripts/**/*.test.mjs"` tests the stale copy and
#    reports green while the action runs the new one. package.json is outside
#    SYNC_PATHS, so adding `.github/actions/**/*.test.mjs` there is the
#    consumer's edit to make.
# 7. That same move breaks an exclude-paths entry naming the OLD path: the entry
#    matches nothing, and the file arrives at the new path. The sync reports
#    every entry that names nothing in the template, so read the inert-entry
#    section of the sync pull request body. Exclude a composite action as the
#    DIRECTORY `.github/actions/<name>`, never as `<name>/action.yaml` alone,
#    so the action's scripts are covered too.
# 8. A file the adopter GENERATES and the TEMPLATE also owns belongs in
#    exclude-paths; one the template does not own is never delivered, so an
#    entry for it is inert per note 7. The sync line-merges, so the template's
#    block lands beside the generated one and the generator reverts it on the
#    next run — the same pull request reopens every week. In JSON that merge
#    can also produce a DUPLICATE member name. RFC 8259 leaves
#    that case to the parser: jq, Python and JavaScript each keep the LAST one,
#    so the adopter's own block silently stops taking effect, while another
#    parser may keep the first or refuse the file outright.
# =============================================================================
#
# ROOT SCAFFOLDING A SYNCED WORKFLOW MAY ASSUME
#
# SYNC_PATHS delivers no root project file: package.json, .nvmrc, pyproject.toml,
# uv.lock and .pre-commit-config.yaml all stay with the consumer. So a synced
# workflow step that needs one must be gated on `hashFiles('<file>') != ''` and
# skip when it is absent. Ungated, it hard-fails on every PR in a consumer that
# never had that scaffolding — a shell-only dotfiles repo, say — and names
# neither the template nor the missing file in the failure. Adding a workflow to
# exclude-paths is the consumer's escape hatch, not the fix; gate the step here
# instead, so a new consumer needs no escape hatch at all.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      dry-run:
        # A `type: boolean` input arrives as a real boolean, so both this default
        # and the expression that forwards it below must be boolean too.
        # Comparing it to the STRING 'true' silently never matches: GitHub casts
        # across types to a number, and `true == 'true'` compares 1 with NaN.
        # That made every "dry run" dispatch open a real pull request.
        description: "Show what would be synced without making changes"
        required: false
        default: false
        type: boolean
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: "0 9 * * 1"

