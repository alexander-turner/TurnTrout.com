packages:
  - "."

overrides:
  # Compatibility pins (exact on purpose).
  subfont>assetgraph: 7.13.0
  workbox-build: 7.3.0
  html-minifier: npm:@minify-html/node@0.15.0
  # Security floors. Each is a caret range at the first patched release so
  # routine lockfile refreshes (`pnpm update`, Dependabot) pick up later
  # patches; an exact pin here would freeze the dep on a version that the next
  # advisory flags.
  d3-color: ^3.1.0
  braces: ^3.0.3
  esbuild: ^0.28.1
  form-data: ^4.0.6
  lodash.template: ^4.5.0
  micromatch: ^4.0.8
  trim: ^1.0.1
  jest-worker: ^30.2.0
  puppeteer: ^25.0.2
  path-to-regexp: ^3.3.0
  lodash-es: ^4.18.1
  lodash: ^4.18.1
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@4: ^5.0.12
  brace-expansion@5: ^5.0.12
  postcss: ^8.5.23
  undici@6: ^6.29.1
  on-headers: ^1.1.0
  diff: ^9.0.0
  tmp: ^0.2.7
  "@eslint/plugin-kit": ^0.3.4
  qs: ^6.16.1
  mermaid: ^11.16.1
  markdown-it: ^14.3.3
  linkify-it: ^5.0.2
  bn.js: ^5.2.3
  hono: ^4.12.14
  "@hono/node-server": ^1.19.13
  "@modelcontextprotocol/sdk": ^1.26.0
  dompurify: ^3.4.17
  svgo: ^3.3.5
  immutable: ^5.1.8
  underscore: ^1.13.8
  serialize-javascript: ^7.1.3
  minimatch@<3.1.4: ^3.1.4
  serve-handler>minimatch: ^3.1.4
  postcss-url>minimatch: ^3.1.4
  filelist>minimatch: ^5.1.8
  minimatch@10: ^11.0.1
  glob@>=9 <14.0.2: ^14.0.2
  "@tootallnate/once": ^3.0.1
  express-rate-limit: ^8.2.2
  serve>ajv: ^8.18.0
  jsonpath: ^1.3.0
  flatted: ^3.4.2
  yauzl: ^3.2.1
  handlebars: ^4.7.10
  micromatch>picomatch: ^2.3.2
  jest-util>picomatch: ^2.3.2
  "@parcel/watcher>picomatch": ^4.0.4
  anymatch>picomatch: ^2.3.2
  tinyglobby>picomatch: ^4.0.4
  smol-toml: ^1.8.1
  cssnano>yaml: ^1.10.3
  lint-staged>yaml: ^2.8.3
  patch-package>yaml: ^2.8.3
  fast-uri: ^3.1.9
  fast-xml-builder: ^1.2.0
  basic-ftp: ^6.2.1
  "@babel/plugin-transform-modules-systemjs": ^7.29.4
  "@babel/core": ^7.29.1
  ip-address: ^10.7.4
  uuid: ^11.1.1
  nanoid@3: ^3.3.18
  source-map-js: ^1.2.2
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  compression: ^1.8.2
  follow-redirects: ^1.16.2
  ws@7: ^7.5.11
  ws@8: ^8.21.0
  zod@4: ^4.6.6
  joi: ^18.3.1
  colord: ^2.9.4
  moment: ^2.31.0
  pbkdf2: ^3.1.7
  postcss-selector-parser@6: ^6.1.5
  postcss-selector-parser@7: ^7.1.6
  piscina@4: ^4.9.4
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  shell-quote: ^1.8.5
  toml: ^5.0.1

packageExtensions:
  stylelint-value-no-unknown-custom-properties:
    peerDependencies:
      postcss: "*"

patchedDependencies:
  pa11y@9.0.1: patches/pa11y@9.0.1.patch
  pa11y@9.1.1: patches/pa11y@9.1.1.patch

onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - puppeteer
  - sharp
  # Transitive dep of wrangler, installed ad hoc by the Cloudflare deploy jobs.
  - workerd

allowBuilds:
  "@turntrout/subfont@https://codeload.github.com/AlexanderMattTurner/subfont/tar.gz/9ef75626d6c4118dff0394996f072b96fa42d33e": true
  "@parcel/watcher": true
  esbuild: true
  puppeteer: true
  sharp: true
  workerd: true
  unrs-resolver: true
  # vnu-jar's postinstall only fetches a bundled JRE we don't use; the runnable
  # jar ships in the npm tarball and vnu_check.py runs it with the system java.
  vnu-jar: false

# First-party packages published from our own provenance-signed CI are exempt
# from the minimum-release-age supply-chain delay applied to third-party deps.
minimumReleaseAgeExclude:
  - punctilio
